name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor Licence Agreement
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA acceptance
        if: |
          (github.event.comment.body == 'I have read the Contributor Licence Agreement and I hereby accept its terms.') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on the private signature store.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: "https://github.com/evigauge-org/helix/blob/main/CLA.md"
          branch: "main"

          # Signatures are kept OUT of this public repo, in a private store.
          remote-organization-name: evigauge-org
          remote-repository-name: cla-signatures
          path-to-signatures: "signatures/helix.json"

          custom-notsigned-prcomment: |
            Thanks for the pull request!

            Before we can merge it, we need you to accept our
            [Contributor Licence Agreement](https://github.com/evigauge-org/helix/blob/main/CLA.md).

            Please read it, then post the following as a comment on this pull request:
          custom-pr-sign-comment: "I have read the Contributor Licence Agreement and I hereby accept its terms."
          custom-allsigned-prcomment: |
            All contributors have accepted the CLA. Thank you.
          lock-pullrequest-aftermerge: false
          allowlist: dependabot[bot],github-actions[bot]
